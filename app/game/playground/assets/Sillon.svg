<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <pattern id="camo-digital" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#3f4e3f" id="rect-bg-dig"/>
      <rect x="0" y="0" width="8" height="6" fill="#2d3a2d" id="rect-dark-dig"/>
      <rect x="10" y="4" width="6" height="8" fill="#546554" id="rect-medium-dig"/>
      <rect x="2" y="10" width="8" height="6" fill="#7ba077" id="rect-light-dig"/>
      <rect x="12" y="12" width="6" height="6" fill="#202a20" id="rect-black-dig"/>
    </pattern>
    
    <linearGradient id="brillo-celular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#e4e4e7"/>

  <g id="sillon-contenedor">
    <rect x="60" y="80" width="380" height="130" rx="15" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <rect x="50" y="180" width="400" height="70" rx="12" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    <line x1="250" y1="180" x2="250" y2="250" stroke="#451a03" stroke-width="1.5"/>
    <rect x="20" y="150" width="60" height="100" rx="20" fill="#b45309" stroke="#451a03" stroke-width="2"/>
    <rect x="420" y="150" width="60" height="100" rx="20" fill="#b45309" stroke="#451a03" stroke-width="2"/>
    <rect x="40" y="250" width="25" height="15" fill="#1c1917"/>
    <rect x="435" y="250" width="25" height="15" fill="#1c1917"/>
  </g>

  <g id="camo-flojo" transform="translate(10, -10)">
    
    <path id="camo-pata-superior" d="M 210 215 L 230 205 L 228 220 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>

    <ellipse id="camo-cuerpo" cx="160" cy="195" rx="35" ry="22" fill="url(#camo-digital)" stroke="#7ba077" stroke-width="0.5"/>
    
    <ellipse id="camo-vientre" cx="165" cy="198" rx="22" ry="14" fill="#d8d8d0" stroke="#000000" stroke-width="0.8"/>
    
    <circle id="camo-cabeza" cx="115" cy="165" r="18" fill="url(#camo-digital)" stroke="#7ba077" stroke-width="0.5"/>
    
    <polygon id="camo-pico" points="128,168 138,174 126,178" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
    
    <g id="camo-ojo-flojera">
      <path d="M 115 158 C 123 158, 125 168, 115 168 Z" fill="#f4f4f5" stroke="#18181b" stroke-width="0.8"/>
      <circle cx="118" cy="164" r="1.5" fill="#000000"/>
      <line x1="112" y1="161" x2="123" y2="162" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <g id="camo-patas-contenedor">
      <path id="camo-pata-inferior" d="M 195 210 L 215 212 L 208 222 Z" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
    </g>
    
    <path id="camo-aleta" d="M 132 185 C 145 180, 155 185, 160 195" stroke-width="3" stroke-linecap="round" stroke="#1c1917" fill="none"/>

    <g id="celular-táctico">
      <polygon points="160,150 162,175 120,165 122,158" fill="url(#brillo-celular)"/>
      
      <rect x="158" y="148" width="8" height="26" rx="1.5" fill="#18181b" stroke="#27272a" stroke-width="0.5" transform="rotate(-15, 160, 160)"/>
      <rect x="159" y="150" width="4" height="22" rx="0.5" fill="#38bdf8" transform="rotate(-15, 160, 160)"/>
    </g>

    <g id="casco-en-suelo" transform="translate(150, 85)">
      <path id="casco-correa" d="M 12 152 C 5 160, 25 160, 18 152" stroke="#1c1917" stroke-width="0.8" fill="none" />
      <path id="casco-cuerpo" d="M 0 150 C 0 165, 30 165, 30 150 C 32 145, -2 145, 0 150 Z" fill="url(#camo-digital)" stroke="#1b2611" stroke-width="0.5"/>
      <path id="casco-banda" d="M 2 153 C 10 157, 20 157, 28 153" stroke="#1c1917" stroke-width="1.2" fill="none" opacity="0.8"/>
    </g>

  </g>
</svg>
