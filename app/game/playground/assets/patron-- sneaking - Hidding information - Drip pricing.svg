    <g id="pantalla-intermedia" transform="matrix(1, 0, 0, 1, 92.000003, 85.000003)">
      <text x="158" y="20" font-family="sans-serif" font-size="18" font-weight="900" fill="#0f172a" text-anchor="middle" style="white-space: pre;">CONFIRMA TUS AÑADIDOS</text>
      <line x1="20" y1="35" x2="296" y2="35" stroke="#f59e0b" stroke-width="2"/>
      <g transform="translate(15, 60)">
        <text x="35.871" y="-1.259" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a0a0a0" style="white-space: pre; font-size: 12px;">Términos y Condiciones Generales</text>
        <rect x="0" y="10" width="286" height="120" rx="4" stroke="#a0a0a0" stroke-width="1" style="fill: rgb(255, 241, 241);"/>
        <text x="10" y="30" font-family="sans-serif" font-size="9" fill="#909090" style="white-space: pre;" transform="matrix(1, 0, 0, 1, -7.480055, -16.11084)"><tspan x="10" dy="1em">​</tspan>        <tspan x="10" dy="0">1. Al continuar, usted acepta que el Iglú Mediterráneo es</tspan><tspan x="10" dy="12">una construcción conceptual no sujeta a leyes físicas.</tspan><tspan x="10" dy="12">2. El vendedor no se responsabiliza de daños por derretimiento</tspan><tspan x="10" dy="12">fortuito en climas templados o superiores a 0°C.</tspan><tspan x="10" dy="12">3. Cualquier reclamación sobre arenques inexistentes será</tspan><tspan x="10" dy="12">derivada al Departamento de Ficción Marítima.</tspan><tspan x="10" dy="12">4. Usted cede los derechos de imagen de sus pingüinos imaginarios.<tspan x="10" dy="1em">​</tspan></tspan><tspan x="10" dy="1em">​</tspan>5. Si puedes leer esto en un celular, envidio tu vista y agradesco tu <tspan x="10" dy="1em">​</tspan>atencion al detalle, ayuda bastante a fijarte en los patrones oscuros!</text>
      </g>
      <g transform="translate(15, 200)">
        <text style="white-space: pre; font-size: 12px;" x="74.792" y="3.626" font-weight="bold" font-size="12" font-family="sans-serif" fill="#0f172a">Servicios Adicionales</text>
        <rect x="0" y="10" width="286" height="80" rx="4" stroke-width="3" style="fill: rgb(160, 160, 160);"/>
        <rect x="15" y="40" width="20" height="20" rx="2" stroke-width="1" style="fill: rgb(223, 218, 232);"/>
        <path d="M 19 50 L 23 54 L 31 46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" style="stroke: rgb(143, 141, 127);"/>
        <text style="white-space: pre; font-size: 10px;" x="55.406" y="28.964" font-weight="bold" font-size="10" font-family="sans-serif" fill="#0f172a">Seguro Anti-Bombardeo Atómico</text>
        <text style="white-space: pre;" font-size="9" font-family="sans-serif" fill="#0f172a" y="45.484" x="40.447" transform="matrix(1, 0, 0, 1, 0.650397, -7.040266)"><tspan x="40.446998596191406" dy="1em">​</tspan>        <tspan x="40.447" dy="0" style="font-size: 10px; word-spacing: 0px;">Cobertura total contra artefactos nucleares enviados</tspan><tspan x="40.447" dy="12" style="font-size: 10px; word-spacing: 0px;">específicamente por pingüinos nativos del Polo Norte.<tspan x="40.446998596191406" dy="1em">​</tspan>(La no existencia de los pingüinos en el Polo Norte no<tspan x="40.446998596191406" dy="1em">​</tspan>invalida este contrato) </tspan></text>
        <text style="fill: rgb(129, 118, 118); font-size: 12px; font-weight: 900; text-anchor: end; white-space: pre;" x="278.376" y="26.096">+19.99€</text>
      </g>
