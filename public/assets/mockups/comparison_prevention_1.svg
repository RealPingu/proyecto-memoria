<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5553 1.6204 400 800" width="400px" height="800px">
  <g transform="matrix(1, 0, 0, 1, -545.537247703589, 51.04437407983458)">
    <rect id="rect-4" width="400" height="800" fill="#fafafa" x="544.982" y="-49.424" style="stroke-width: 1;"/>
    <g id="header-planes" fill="#0f766e" transform="matrix(1, 0, 0, 1, 544.982011, -49.41945)">
      <rect x="0" y="0" width="400" height="55"/>
      <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">SMART FITNESS CLUB</text>
    </g>
    <g id="planes-intro" transform="matrix(1, 0, 0, 1, 564.982011, 25.58055)">
      <text x="180" y="20" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" style="white-space: pre;">Selecciona tu Plan de Acceso</text>
      <text x="180" y="38" fill="#64748b" font-family="sans-serif" font-size="11.5" text-anchor="middle" style="white-space: pre;">Entrena en cualquiera de nuestras sucursales</text>
    </g>
    <g id="planes-inconsistentes" transform="matrix(1, 0, 0, 1, 564.982011, 85.580554)">
      <!-- PLAN 1: Pase Diario -->
      <g id="plan-basico" transform="translate(0, 0)">
        <rect x="0" y="0" width="360" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="40" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Diario Acceso</text>
        <text x="20" y="60" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Ideal para entrenamientos ocasionales</text>
        <text x="340" y="50" fill="#0d9488" font-family="sans-serif" font-size="25" font-weight="black" text-anchor="end" style="white-space: pre;">
          <tspan x="340" dy="0">1.800 CLP</tspan>
          <tspan x="340" dy="16" fill="#64748b" font-size="10" font-weight="normal">Por día / acceso individual</tspan>
        </text>
        <text x="20" y="115" fill="#475569" font-family="sans-serif" font-size="11.5" style="white-space: pre;">• Acceso a musculación y cardio</text>
      </g>
      <!-- PLAN 2: Pase Semanal (Recomendado) -->
      <g id="plan-profesional" transform="translate(0, 175)">
        <rect x="0" width="360" height="150" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" y="0"/>
        <rect x="230" y="-10" width="110" height="22" rx="11" fill="#0d9488"/>
        <text x="285" y="4" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle" style="white-space: pre;">RECOMENDADO</text>
        <text x="20" y="40" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Semanal Club</text>
        <text x="20" y="60" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Pase más elegido por estudiantes</text>
        <text x="340" y="50" fill="#0d9488" font-family="sans-serif" font-size="25" font-weight="black" text-anchor="end" style="white-space: pre;">
          <tspan x="340" dy="0">8.990 CLP</tspan>
          <tspan x="340" dy="16" fill="#64748b" font-size="10" font-weight="normal">Por semana / renovación automática</tspan>
        </text>
        <text x="20" y="115" fill="#475569" font-family="sans-serif" font-size="11.5" style="white-space: pre;">• Acceso a clases dirigidas y piscina</text>
      </g>
      <!-- PLAN 3: Pase Mensual -->
      <g id="plan-empresa" transform="translate(0, 350)">
        <rect x="0" y="0" width="360" height="150" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="20" y="40" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Mensual Premium</text>
        <text x="20" y="60" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Acceso ilimitado 24/7 sin restricciones</text>
        <text x="340" y="50" fill="#0f172a" font-family="sans-serif" font-size="25" font-weight="black" text-anchor="end" style="white-space: pre;">
          <tspan x="340" dy="0">27.990 CLP</tspan>
          <tspan x="340" dy="16" fill="#64748b" font-size="10" font-weight="normal">Por mes / contrato flexible mensual</tspan>
        </text>
        <text x="20" y="115" fill="#475569" font-family="sans-serif" font-size="11.5" style="white-space: pre;">• Evaluación nutricional y clases gratis</text>
      </g>
    </g>
    <!-- Footer con términos arriba y botón abajo -->
    <g id="footer-planes" transform="matrix(1, 0, 0, 1, 564.982011, 640.079914)">
      <text x="180" y="15" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle" style="white-space: pre;">
        <tspan x="180" dy="0">Renovación automática sujeta a los términos y condiciones de la suscripción.</tspan>
        <tspan x="180" dy="12">Puedes cancelar la suscripción en cualquier momento desde tu panel de usuario.</tspan>
      </text>
      <rect x="0" y="45" width="360" height="50" rx="8" fill="#0d9488"/>
      <text x="180" y="75" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" style="white-space: pre;">CONTRATAR PLAN SELECCIONADO</text>
    </g>
  </g>
</svg>
