<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header SMART FITNESS -->
  <g id="header-planes" fill="#0f766e">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">SMART FITNESS CLUB</text>
  </g>

  <!-- Título de Planes -->
  <g id="planes-intro" transform="translate(20, 75)">
    <text x="180" y="20" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Selecciona tu Plan de Acceso</text>
    <text x="180" y="36" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle">Entrena en cualquiera de nuestras sucursales</text>
  </g>

  <!-- Planes con trampa: Diferente unidad de tiempo para dificultar cálculo -->
  <g id="planes-inconsistentes" transform="translate(20, 135)">
    
    <!-- PLAN 1: Básico (Precio por DÍA) -->
    <g id="plan-basico" transform="translate(0, 0)">
      <rect x="0" y="0" width="360" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Pase Diario Acceso</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Ideal para entrenamientos ocasionales</text>
      
      <text x="340" y="45" fill="#0d9488" font-family="sans-serif" font-size="22" font-weight="black" text-anchor="end">1.800 CLP</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por día / acceso individual</text>
      
      <text x="20" y="92" fill="#475569" font-family="sans-serif" font-size="10">• Acceso a musculación y cardio</text>
    </g>

    <!-- PLAN 2: TRAMPA - Profesional (Precio por SEMANA pero se ve igual) -->
    <g id="plan-profesional" transform="translate(0, 150)">
      <rect x="0" y="0" width="360" height="120" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
      
      <!-- Popular badge -->
      <rect x="250" y="-10" width="90" height="20" rx="10" fill="#0d9488" />
      <text x="295" y="3" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">RECOMENDADO</text>

      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Pase Semanal Club</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Pase más elegido por estudiantes</text>
      
      <text x="340" y="45" fill="#0d9488" font-family="sans-serif" font-size="22" font-weight="black" text-anchor="end">8.990 CLP</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por semana / renovación automática</text>
      
      <text x="20" y="92" fill="#475569" font-family="sans-serif" font-size="10">• Acceso a clases dirigidas y piscina</text>
    </g>

    <!-- PLAN 3: Empresa (Precio por MES) -->
    <g id="plan-empresa" transform="translate(0, 300)">
      <rect x="0" y="0" width="360" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Pase Mensual Premium</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Acceso ilimitado 24/7 sin restricciones</text>
      
      <text x="340" y="45" fill="#0f172a" font-family="sans-serif" font-size="22" font-weight="black" text-anchor="end">27.990 CLP</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por mes / contrato flexible mensual</text>
      
      <text x="20" y="92" fill="#475569" font-family="sans-serif" font-size="10">• Evaluación nutricional y clases gratis</text>
    </g>
  </g>

  <!-- Términos y Botón de Contratación -->
  <g id="footer-planes" transform="translate(20, 600)">
    <rect x="0" y="0" width="360" height="50" rx="8" fill="#0d9488" />
    <text x="180" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONTRATAR PLAN SELECCIONADO</text>
    
    <text x="180" y="80" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">
      <tspan x="180" dy="0">Renovación automática sujeta a los términos y condiciones de la suscripción.</tspan>
      <tspan x="180" dy="12">Puedes cancelar la suscripción en cualquier momento desde tu panel de usuario.</tspan>
    </text>
  </g>
</svg>
