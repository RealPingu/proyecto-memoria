<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#ffffff" />
  
  <!-- Header -->
  <g id="header-planes" fill="#0f766e">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">SERVIDORES CLOUD POLARES</text>
  </g>

  <!-- Título de Planes -->
  <g id="planes-intro" transform="translate(20, 75)">
    <text x="180" y="20" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Selecciona tu Plan de Alojamiento</text>
    <text x="180" y="36" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle">Escalable, rápido y seguro</text>
  </g>

  <!-- Planes con trampa: Diferente unidad de tiempo para dificultar cálculo -->
  <g id="planes-inconsistentes" transform="translate(20, 135)">
    
    <!-- PLAN 1: Básico (Precio por DÍA) -->
    <g id="plan-basico">
      <rect x="0" y="0" width="360" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Plan Básico Inicial</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Ideal para pruebas menores</text>
      
      <text x="340" y="45" fill="#0d9488" font-family="sans-serif" font-size="24" font-weight="black" text-anchor="end">$0.45</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por día / facturado mensual</text>
      
      <text x="20" y="88" fill="#475569" font-family="sans-serif" font-size="10">• 1 Core CPU • 2 GB RAM</text>
    </g>

    <!-- PLAN 2: TRAMPA - Profesional (Precio por SEMANA pero se ve igual) -->
    <g id="plan-profesional" transform="translate(0, 130)">
      <rect x="0" y="0" width="360" height="110" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" />
      
      <!-- Popular badge -->
      <rect x="250" y="-10" width="90" height="20" rx="10" fill="#0d9488" />
      <text x="295" y="3" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">RECOMENDADO</text>

      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Plan Pro Táctico</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">El más elegido para servidores</text>
      
      <text x="340" y="45" fill="#0d9488" font-family="sans-serif" font-size="24" font-weight="black" text-anchor="end">$2.99</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por semana / pago anual</text>
      
      <text x="20" y="88" fill="#475569" font-family="sans-serif" font-size="10">• 4 Cores CPU • 8 GB RAM</text>
    </g>

    <!-- PLAN 3: Empresa (Precio por MES) -->
    <g id="plan-empresa" transform="translate(0, 260)">
      <rect x="0" y="0" width="360" height="110" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="20" y="35" fill="#0f172a" font-family="sans-serif" font-size="14" font-weight="bold">Plan Empresa Premium</text>
      <text x="20" y="52" fill="#64748b" font-family="sans-serif" font-size="10">Infraestructura dedicada</text>
      
      <text x="340" y="45" fill="#0f172a" font-family="sans-serif" font-size="24" font-weight="black" text-anchor="end">$14.99</text>
      <text x="340" y="60" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="end">Por mes / contrato flexible</text>
      
      <text x="20" y="88" fill="#475569" font-family="sans-serif" font-size="10">• 16 Cores CPU • 32 GB RAM</text>
    </g>
  </g>

  <!-- Footer -->
  <g id="footer-planes-btn" transform="translate(20, 535)">
    <rect x="0" y="0" width="360" height="50" rx="8" fill="#0d9488" />
    <text x="180" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONTRATAR PLAN SELECCIONADO</text>
  </g>
</svg>
