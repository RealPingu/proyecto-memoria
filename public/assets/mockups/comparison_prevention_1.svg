<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.5553 1.6204 400 800" width="400px" height="800px">
  <g transform="matrix(1, 0, 0, 1, -545.537247703589, 51.04437407983458)">
    <rect id="rect-4" width="400" height="800" fill="#fafafa" x="544.982" y="-49.424" style="stroke-width: 1;"/>
    <g id="header-planes" fill="#0f766e" transform="matrix(1, 0, 0, 1, 544.982011, -49.41945)">
      <rect x="0" y="0" width="400" height="55"/>
      <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">SMART FITNESS CLUB</text>
    </g>
    <!-- Intro: Absolute Y = 80 -->
    <g id="planes-intro" transform="matrix(1, 0, 0, 1, 564.982011, 28.955626)">
      <text x="180" y="20" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" style="white-space: pre;">Selecciona tu Plan de Acceso</text>
      <text x="180" y="38" fill="#64748b" font-family="sans-serif" font-size="11.5" text-anchor="middle" style="white-space: pre;">Entrena en cualquiera de nuestras sucursales</text>
    </g>
    <!-- Plans: Absolute Y = 145 -->
    <g id="planes-inconsistentes" transform="matrix(1, 0, 0, 1, 564.982011, 93.955626)">
      <!-- PLAN 1: Pase Diario -->
      <g id="plan-basico" transform="translate(0, 0)">
        <!-- Rectángulo Izquierdo (Información) -->
        <rect x="0" y="0" width="240" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Diario Acceso</text>
        <text x="15" y="58" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Ideal para entrenamientos ocasionales</text>
        <text x="15" y="98" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Acceso exclusivo a zona de cardio</text>
        <text x="15" y="120" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Excluye uso de pesas y camarines</text>
        
        <!-- Rectángulo Derecho (Precio) -->
        <rect x="250" y="0" width="110" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="305" y="75" fill="#0d9488" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle" style="white-space: pre;">1.800 CLP</text>
        <text x="305" y="98" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle" style="white-space: pre;">Pase diario</text>
      </g>
      
      <!-- PLAN 2: Pase Semanal (Recomendado) -->
      <g id="plan-profesional" transform="translate(0, 175)">
        <!-- Rectángulo Izquierdo (Información) -->
        <rect x="0" y="0" width="240" height="155" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
        <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Semanal Club</text>
        <text x="15" y="58" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Pase más elegido por estudiantes</text>
        <text x="15" y="90" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Acceso a musculación y peso libre</text>
        <text x="15" y="112" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Clases grupales (excepto spinning)</text>
        <text x="15" y="134" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• No incluye uso de piscina</text>
        
        <!-- Rectángulo Derecho (Precio Destacado) -->
        <rect x="250" y="0" width="110" height="155" rx="8" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
        <text x="305" y="75" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle" style="white-space: pre;">8.990 CLP</text>
        <text x="305" y="98" fill="#ccfbf1" font-family="sans-serif" font-size="10.5" text-anchor="middle" style="white-space: pre;">Pase semanal</text>
        
        <!-- Badge Recomendado (Centrado sobre el segundo rectángulo a la derecha) -->
        <rect x="255" y="-10" width="100" height="20" rx="10" fill="#0f766e"/>
        <text x="305" y="3" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" style="white-space: pre;">RECOMENDADO</text>
      </g>
      
      <!-- PLAN 3: Pase Mensual -->
      <g id="plan-empresa" transform="translate(0, 350)">
        <!-- Rectángulo Izquierdo (Información) -->
        <rect x="0" y="0" width="240" height="155" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
        <text x="15" y="38" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold" style="white-space: pre;">Pase Mensual Premium</text>
        <text x="15" y="58" fill="#64748b" font-family="sans-serif" font-size="11" style="white-space: pre;">Acceso ilimitado 24/7 sin restricciones</text>
        <text x="15" y="90" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Musculación y clases (sin spinning)</text>
        <text x="15" y="112" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Incluye piscina y 2 toallas al mes</text>
        <text x="15" y="134" fill="#475569" font-family="sans-serif" font-size="13" style="white-space: pre;">• Evaluación física con costo adicional</text>
        
        <!-- Rectángulo Derecho (Precio) -->
        <rect x="250" y="0" width="110" height="155" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
        <text x="305" y="75" fill="#0f172a" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle" style="white-space: pre;">27.990 CLP</text>
        <text x="305" y="98" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle" style="white-space: pre;">Pase mensual</text>
      </g>
    </g>
    <!-- Footer: Absolute Y = 665 -->
    <g id="footer-planes" transform="matrix(1, 0, 0, 1, 564.982011, 613.955626)">
      <text x="180" y="15" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle" style="white-space: pre;">
        <tspan x="180" dy="0">Renovación automática sujeta a los términos y condiciones de la suscripción.</tspan>
        <tspan x="180" dy="12">Puedes cancelar la suscripción en cualquier momento desde tu panel de usuario.</tspan>
      </text>
      <rect x="0" y="45" width="360" height="75" rx="8" fill="#0d9488"/>
      <text x="180" y="90" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" style="white-space: pre;">CONTRATAR PLAN SELECCIONADO</text>
    </g>
  </g>
</svg>
