<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#0c0d14" />
  
  <!-- Header -->
  <g id="header-hosting" fill="#1e1b4b">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">NEXUS STREAMING VIP</text>
  </g>

  <g id="planes-referencia-intro" transform="translate(20, 75)">
    <text x="180" y="20" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Elige tu Suscripción de Video</text>
  </g>

  <!-- Comparación cebo: Resalta una opción con tasas bajas ficticias -->
  <g id="planes-cebo-comparativa" transform="translate(20, 125)">
    
    <!-- PLAN CEBO: Premium destacado con Verde Llamativo y Tasa por semana engañosa -->
    <g id="plan-cebo-premium">
      <rect x="0" y="0" width="360" height="150" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="2.5" />
      <rect x="15" y="-12" width="120" height="22" rx="11" fill="#22c55e" />
      <text x="75" y="2" fill="#022c22" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">¡TASA MÁS CONVENIENTE!</text>

      <text x="20" y="35" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Suscripción Premium Ultra</text>
      <text x="20" y="55" fill="#86efac" font-family="sans-serif" font-size="26" font-weight="black">$1.99 <tspan font-size="11" font-weight="normal" fill="#a3e635">/ semana de referencia</tspan></text>
      
      <text x="20" y="85" fill="#f8fafc" font-family="sans-serif" font-size="9.5">Contrato a largo plazo de 240 meses (20 años).</text>
      <text x="20" y="100" fill="#f8fafc" font-family="sans-serif" font-size="9.5">Total final diferido del contrato: $2,069.60.</text>
      
      <rect x="20" y="115" width="320" height="22" rx="4" fill="#22c55e" />
      <text x="180" y="129" fill="#022c22" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">CONTRATAR PLAN PREMIUM</text>
    </g>

    <!-- PLAN ESTÁNDAR: Opción honesta pero apagada en gris oscuro -->
    <g id="plan-real-estandar" transform="translate(0, 175)">
      <rect x="0" y="0" width="360" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      
      <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="bold">Suscripción Estándar Anual</text>
      <text x="20" y="52" fill="#f3f4f6" font-family="sans-serif" font-size="18" font-weight="bold">$9.99 <tspan font-size="10" fill="#9ca3af">/ mes real</tspan></text>
      
      <text x="20" y="75" fill="#9ca3af" font-family="sans-serif" font-size="9">Facturado anualmente ($119.88/año). Renovación flexible.</text>
    </g>

    <!-- PLAN BÁSICO: Otro plan señuelo para forzar la comparación -->
    <g id="plan-cebo-basico" transform="translate(0, 290)">
      <rect x="0" y="0" width="360" height="100" rx="8" fill="#111827" stroke="#374151" stroke-width="1" />
      
      <text x="20" y="30" fill="#9ca3af" font-family="sans-serif" font-size="13" font-weight="bold">Suscripción Básica Mensual</text>
      <text x="20" y="52" fill="#f3f4f6" font-family="sans-serif" font-size="18" font-weight="bold">$15.99 <tspan font-size="10" fill="#9ca3af">/ mes real</tspan></text>
      
      <text x="20" y="75" fill="#9ca3af" font-family="sans-serif" font-size="9">Cancelación en cualquier momento. Sin permanencia.</text>
    </g>
  </g>
</svg>
