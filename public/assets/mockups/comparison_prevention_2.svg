<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header NEXUS STREAM VIP -->
  <g id="header-streaming" fill="#1e3a8a">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="1">NEXUS STREAMING VIP</text>
  </g>

  <!-- Título de Suscripciones -->
  <g id="planes-streaming-intro" transform="translate(20, 75)">
    <text x="180" y="20" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Elige tu Suscripción de Video</text>
    <text x="180" y="36" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle">Series, películas y documentales ilimitados</text>
  </g>

  <!-- Planes con trampa: Diferente unidad de tiempo para dificultar cálculo -->
  <g id="planes-streaming-inconsistentes" transform="translate(20, 135)">
    
    <!-- PLAN 1: Suscripción Premium (Precio por SEMANA) -->
    <g id="plan-premium-ultra" transform="translate(0, 0)">
      <!-- Rectángulo Izquierdo (Información) -->
      <rect x="0" y="0" width="240" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="15" y="40" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Suscripción Premium Ultra</text>
      <text x="15" y="60" fill="#64748b" font-family="sans-serif" font-size="10.5">Calidad 4K HDR + 4 pantallas a la vez</text>
      <text x="15" y="95" fill="#475569" font-family="sans-serif" font-size="11.5">• Contrato mínimo de 24 meses</text>
      <text x="15" y="117" fill="#475569" font-family="sans-serif" font-size="11.5">• Pago mensual diferido automático</text>
      
      <!-- Rectángulo Derecho (Precio Destacado) -->
      <rect x="250" y="0" width="110" height="150" rx="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
      <text x="305" y="72" fill="#ffffff" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle">1.290 CLP</text>
      <text x="305" y="95" fill="#dbeafe" font-family="sans-serif" font-size="10.5" text-anchor="middle">Por semana</text>
      
      <!-- Badge Recomendado -->
      <rect x="255" y="-10" width="100" height="20" rx="10" fill="#1e3a8a"/>
      <text x="305" y="3" fill="#ffffff" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">RECOMENDADO</text>
    </g>
    
    <!-- PLAN 2: Suscripción Estándar Anual (Precio por MES) -->
    <g id="plan-estandar-anual" transform="translate(0, 175)">
      <!-- Rectángulo Izquierdo (Información) -->
      <rect x="0" y="0" width="240" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="40" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Suscripción Estándar Anual</text>
      <text x="15" y="60" fill="#64748b" font-family="sans-serif" font-size="10.5">Calidad 1080p + 2 pantallas simultáneas</text>
      <text x="15" y="95" fill="#475569" font-family="sans-serif" font-size="11.5">• Facturado anualmente (71.880 CLP)</text>
      
      <!-- Rectángulo Derecho (Precio) -->
      <rect x="250" y="0" width="110" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="305" y="65" fill="#1e3a8a" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle">5.990 CLP</text>
      <text x="305" y="88" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle">Por mes</text>
    </g>
    
    <!-- PLAN 3: Suscripción Básica Mensual (Precio por MES) -->
    <g id="plan-basica-mensual" transform="translate(0, 325)">
      <!-- Rectángulo Izquierdo (Información) -->
      <rect x="0" y="0" width="240" height="130" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="40" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Suscripción Básica Mensual</text>
      <text x="15" y="60" fill="#64748b" font-family="sans-serif" font-size="10.5">Calidad 720p + 1 pantalla activa</text>
      <text x="15" y="95" fill="#475569" font-family="sans-serif" font-size="11.5">• Sin permanencia ni contratos</text>
      
      <!-- Rectángulo Derecho (Precio) -->
      <rect x="250" y="0" width="110" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="305" y="65" fill="#1e3a8a" font-family="sans-serif" font-size="19" font-weight="black" text-anchor="middle">8.990 CLP</text>
      <text x="305" y="88" fill="#64748b" font-family="sans-serif" font-size="10.5" text-anchor="middle">Por mes</text>
    </g>
  </g>

  <!-- Footer con términos arriba y botón abajo -->
  <g id="footer-streaming-planes" transform="translate(20, 615)">
    <text x="180" y="15" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">
      <tspan x="180" dy="0">La cancelación del plan premium tiene un cargo por término anticipado de contrato.</tspan>
      <tspan x="180" dy="12">Precios promocionales válidos por tiempo limitado. Sujeto a cambios tarifarios.</tspan>
    </text>
    <rect x="0" y="45" width="360" height="50" rx="8" fill="#1e3a8a"/>
    <text x="180" y="75" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONTRATAR PLAN SELECCIONADO</text>
  </g>
</svg>
