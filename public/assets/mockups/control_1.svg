<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#1e1b4b" />
  
  <!-- Logo de la aplicación: Centrado y desplazado ligeramente hacia abajo -->
  <g id="logo-centro" transform="translate(20, 120)">
    <circle cx="180" cy="50" r="40" fill="#4f46e5" />
    <text x="180" y="60" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="black" text-anchor="middle">P</text>
    <text x="180" y="115" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">PORTAL ACCESO</text>
    <text x="180" y="135" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="middle">AUTENTICACIÓN DE USUARIO</text>
  </g>

  <!-- Formulario de Login: Espaciado optimizado de 350px en adelante -->
  <g id="formulario-login" transform="translate(30, 350)">
    <!-- Input Usuario -->
    <text x="0" y="15" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold">CORREO ELECTRÓNICO</text>
    <rect x="0" y="25" width="340" height="55" rx="8" fill="#312e81" stroke="#4338ca" stroke-width="1" />
    <text x="15" y="58" fill="#a5b4fc" font-family="sans-serif" font-size="13">ejemplo@correo.com</text>

    <!-- Input Clave -->
    <text x="0" y="115" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold">CONTRASEÑA</text>
    <rect x="0" y="125" width="340" height="55" rx="8" fill="#312e81" stroke="#4338ca" stroke-width="1" />
    <text x="15" y="158" fill="#a5b4fc" font-family="sans-serif" font-size="13">••••••••••••</text>
    <text x="340" y="200" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="end" text-decoration="underline">¿Olvidaste tu contraseña?</text>

    <!-- Botón Ingresar: Aumentado a 60px de alto -->
    <rect x="0" y="240" width="340" height="60" rx="8" fill="#6366f1" />
    <text x="170" y="276" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">INICIAR SESIÓN</text>

    <!-- Registro -->
    <text x="170" y="335" fill="#a5b4fc" font-family="sans-serif" font-size="11" text-anchor="middle">
      ¿No tienes una cuenta? <tspan fill="#ffffff" font-weight="bold" text-decoration="underline">Regístrate gratis</tspan>
    </text>
  </g>
</svg>
