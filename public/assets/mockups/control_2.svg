<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header -->
  <g id="header-limpio" fill="#18181b">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">CHECKOUT SEGURO</text>
  </g>

  <!-- Resumen del Item -->
  <g id="resumen-item" transform="translate(20, 75)">
    <text x="0" y="20" fill="#18181b" font-family="sans-serif" font-size="14" font-weight="bold">Item a Comprar</text>
    <rect x="0" y="35" width="360" height="90" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <rect x="15" y="50" width="60" height="60" rx="4" fill="#f4f4f5" />
    <text x="25" y="85" fill="#a1a1aa" font-family="sans-serif" font-size="11" font-weight="bold">AUDIO</text>
    <text x="90" y="65" fill="#18181b" font-family="sans-serif" font-size="13" font-weight="bold">Auriculares Inalámbricos Pro</text>
    <text x="90" y="85" fill="#71717a" font-family="sans-serif" font-size="11">Cantidad: 1</text>
    <text x="345" y="65" fill="#18181b" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">$120,000</text>
  </g>

  <!-- Desglose de Gastos Transparentes (Sin sorpresas) -->
  <g id="desglose-transparente" transform="translate(20, 195)">
    <rect x="0" y="0" width="360" height="190" rx="8" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    
    <text x="15" y="30" fill="#71717a" font-family="sans-serif" font-size="11">Precio Unitario</text>
    <text x="345" y="30" fill="#18181b" font-family="sans-serif" font-size="11" text-anchor="end">$120,000.00</text>
    
    <text x="15" y="55" fill="#71717a" font-family="sans-serif" font-size="11">Gastos de Envío / Despliegue</text>
    <text x="345" y="55" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">Gratis</text>

    <text x="15" y="80" fill="#71717a" font-family="sans-serif" font-size="11">Impuestos de Reserva (19% IVA)</text>
    <text x="345" y="80" fill="#18181b" font-family="sans-serif" font-size="11" text-anchor="end">$0.00 (Incluido)</text>

    <line x1="15" y1="105" x2="345" y2="105" stroke="#f4f4f5" stroke-width="1" />

    <text x="15" y="135" fill="#18181b" font-family="sans-serif" font-size="15" font-weight="bold">Total Final Declarado</text>
    <text x="345" y="135" fill="#18181b" font-family="sans-serif" font-size="16" font-weight="black" text-anchor="end">$120,000.00</text>
    
    <text x="15" y="165" fill="#71717a" font-family="sans-serif" font-size="9">No se aplicarán cobros ni comisiones adicionales a esta transacción.</text>
  </g>

  <!-- Botón Proceder sin trampas -->
  <g id="footer-compra-segura" transform="translate(20, 410)">
    <rect x="0" y="0" width="360" height="50" rx="8" fill="#18181b" />
    <text x="180" y="30" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">COMPRAR AHORA POR $120,000</text>
  </g>
</svg>
