<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header de la App -->
  <g id="header-app" fill="#0891b2">
    <rect x="0" y="0" width="400" height="60" />
    <text x="20" y="38" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" letter-spacing="1">SOFTZONE DESCARGAS</text>
  </g>

  <!-- Ficha del Software -->
  <g id="info-producto" transform="translate(20, 90)">
    <rect id="bg-info" width="360" height="110" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <rect id="icon-software" x="15" y="15" width="80" height="80" rx="8" fill="#3b82f6" />
    <text x="35" y="65" fill="#ffffff" font-family="sans-serif" font-size="32" font-weight="black">PDF</text>
    <text x="110" y="45" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="bold">PDF Reader &amp; Creator Pro</text>
    <text x="110" y="68" fill="#64748b" font-family="sans-serif" font-size="11">Versión 4.2.1 • Gratis (5.4 MB)</text>
    <text x="110" y="88" fill="#22c55e" font-family="sans-serif" font-size="11" font-weight="bold">Verificado: Libre de Virus</text>
  </g>

  <!-- TRAMPA: Anuncio Disfrazado 1 (Botón de descarga gigante que en realidad es publicidad) -->
  <g id="anuncio-disfrazado-descarga-trampa" transform="translate(20, 220)">
    <rect id="bg-ad-wrapper" width="360" height="150" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    
    <!-- Botón trampa -->
    <rect id="boton-descarga-trampa" x="20" y="25" width="320" height="65" rx="8" fill="#22c55e" />
    <text x="180" y="55" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">DESCARGAR AHORA</text>
    <text x="180" y="77" fill="#ffffff" font-family="sans-serif" font-size="11" text-anchor="middle" fill-opacity="0.9">Servidor Seguro de Alta Velocidad (Recomendado)</text>
    
    <!-- Etiqueta AD minúscula -->
    <rect id="badge-ad" x="20" y="105" width="22" height="13" rx="2" fill="#94a3b8" />
    <text x="31" y="115" fill="#ffffff" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">AD</text>
    <text x="48" y="115" fill="#64748b" font-family="sans-serif" font-size="10">Anuncio patrocinado por instalador express.</text>
  </g>

  <!-- Enlace de descarga Real (Pequeño y gris) -->
  <g id="descarga-legitima-alternativa" transform="translate(20, 390)">
    <rect id="bg-descarga-real" width="360" height="50" rx="8" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" />
    <text x="180" y="30" fill="#64748b" font-family="sans-serif" font-size="11" text-anchor="middle">
      Si la descarga no se inicia, pulsa en el <tspan fill="#3b82f6" font-weight="bold" text-decoration="underline">enlace alternativo directo</tspan> para descargar el .zip original.
    </text>
  </g>

  <!-- Comentarios de usuarios simulados -->
  <g id="user-comments" transform="translate(20, 465)">
    <text x="0" y="20" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="bold">Comentarios (24)</text>
    
    <g id="comment-1" transform="translate(0, 35)">
      <circle cx="20" cy="20" r="16" fill="#cbd5e1" />
      <text x="15" y="24" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">JU</text>
      <text x="45" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Juan U.</text>
      <text x="45" y="32" fill="#64748b" font-family="sans-serif" font-size="10">Funciona excelente, fácil de configurar.</text>
    </g>

    <g id="comment-2" transform="translate(0, 85)">
      <circle cx="20" cy="20" r="16" fill="#cbd5e1" />
      <text x="15" y="24" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">MA</text>
      <text x="45" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">María A.</text>
      <text x="45" y="32" fill="#64748b" font-family="sans-serif" font-size="10">Tenía dudas pero la descarga fue súper rápida.</text>
    </g>

    <g id="comment-3" transform="translate(0, 135)">
      <circle cx="20" cy="20" r="16" fill="#cbd5e1" />
      <text x="15" y="24" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">CA</text>
      <text x="45" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Carlos P.</text>
      <text x="45" y="32" fill="#64748b" font-family="sans-serif" font-size="10">Muy buena aplicación para editar mis PDFs.</text>
    </g>

    <g id="comment-4" transform="translate(0, 185)">
      <circle cx="20" cy="20" r="16" fill="#cbd5e1" />
      <text x="15" y="24" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">LA</text>
      <text x="45" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Laura G.</text>
      <text x="45" y="32" fill="#64748b" font-family="sans-serif" font-size="10">Excelente visor, ligero y no consume RAM.</text>
    </g>

    <g id="comment-5" transform="translate(0, 235)">
      <circle cx="20" cy="20" r="16" fill="#cbd5e1" />
      <text x="15" y="24" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="bold">SE</text>
      <text x="45" y="15" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="bold">Sergio M.</text>
      <text x="45" y="32" fill="#64748b" font-family="sans-serif" font-size="10">100% recomendado para uso diario.</text>
    </g>
  </g>
</svg>
