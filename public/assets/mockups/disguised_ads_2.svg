    <g id="group-1" transform="matrix(1, 0, 0, 1, 561.223955, 51.728647)">
      <text x="0" y="20" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold" style="white-space: pre;">10 datos sorprendentes del Polo Sur</text>
      <text x="0" y="38" fill="#64748b" font-family="sans-serif" font-size="10" style="white-space: pre;">Por Redacción Ciencia • Actualizado hoy</text>
      <g id="foto-contenedor-1" transform="translate(0, 50)">
        <image href="/assets/mockups/danielle-barnes.jpg" width="360" height="140" preserveAspectRatio="xMidYMid slice"/>
      </g>
      <g id="datos-lista-1" transform="translate(0, 210)">
        <text x="0" y="12" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" style="white-space: pre;">1. Es el desierto más grande y seco del planeta</text>
        <text x="0" y="26" fill="#475569" font-family="sans-serif" font-size="10" style="white-space: pre;">Aunque está cubierto de hielo, recibe menos de 10 mm de lluvia al año.</text>
        <text x="0" y="52" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" style="white-space: pre;">2. Toda la zona está sobre una capa de hielo de 2.8 km</text>
        <text x="0" y="66" fill="#475569" font-family="sans-serif" font-size="10" style="white-space: pre;">La altitud real del Polo Sur geográfico es de 2,835 metros sobre el nivel del mar.</text>
      </g>
      <g id="foto-contenedor-2" transform="matrix(1, 0, 0, 1.678783, 0, 295.000009)" style="">
        <image href="/assets/mockups/noaa.jpg" width="360" height="100" preserveAspectRatio="none"/>
      </g>
      <g id="datos-lista-2" transform="matrix(1, 0, 0, 1, 5.155316, 479.596786)">
        <text x="0" y="12" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold" style="white-space: pre;">3. El sol sale y se pone solo una vez al año</text>
        <text x="0" y="26" fill="#475569" font-family="sans-serif" font-size="10" style="white-space: pre;">Hay 6 meses de luz solar continua seguidos por 6 meses de oscuridad total.</text>
      </g>
    </g>
    <g id="group-2" transform="matrix(1, 0, 0, 1, 559.505571, 578.747759)">
