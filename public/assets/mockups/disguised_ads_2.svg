    <rect id="rect-1" width="400" height="800" fill="#ffffff" x="541.224" y="-23.271" style="stroke-width: 1;"/>
    <g id="header-app" fill="#1e3a8a" transform="matrix(1, 0, 0, 1, 541.223893, -23.271382)">
