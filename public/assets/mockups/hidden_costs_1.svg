<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header -->
  <g id="header-boleteria" fill="#4f46e5">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">PENGUIN EVENTS TOURS</text>
  </g>

  <!-- Ticket Info -->
  <g id="resumen-ticket" transform="translate(20, 75)">
    <text x="0" y="20" fill="#1f2937" font-family="sans-serif" font-size="15" font-weight="bold">Resumen de Compra de Entrada</text>
    <rect x="0" y="35" width="360" height="80" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    <text x="15" y="60" fill="#111827" font-family="sans-serif" font-size="13" font-weight="bold">Entrada General - Concierto Glacial</text>
    <text x="15" y="80" fill="#6b7280" font-family="sans-serif" font-size="11">Fecha: 15 de Julio • 21:00 hrs</text>
    <text x="345" y="60" fill="#111827" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="end">$45.00</text>
  </g>

  <!-- Desglose de Costos (con trampa oculta de Delivery Fee sorpresa) -->
  <g id="desglose-pagos" transform="translate(20, 185)">
    <rect x="0" y="0" width="360" height="260" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
    
    <text x="15" y="30" fill="#374151" font-family="sans-serif" font-size="11">Subtotal de la Entrada</text>
    <text x="345" y="30" fill="#374151" font-family="sans-serif" font-size="11" text-anchor="end">$45.00</text>
    
    <text x="15" y="55" fill="#374151" font-family="sans-serif" font-size="11">Impuesto Local Polar (IVA)</text>
    <text x="345" y="55" fill="#374151" font-family="sans-serif" font-size="11" text-anchor="end">$4.50</text>

    <!-- TRAMPA: Cargo de Emisión sorpresa + Cargo de seguro de envío predeterminado -->
    <text x="15" y="90" fill="#e11d48" font-family="sans-serif" font-size="11" font-weight="bold">Cargo de Procesamiento Web</text>
    <text x="345" y="90" fill="#e11d48" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">$12.50</text>

    <text x="15" y="115" fill="#e11d48" font-family="sans-serif" font-size="11" font-weight="bold">Cargo por Envío Digital Inmediato</text>
    <text x="345" y="115" fill="#e11d48" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="end">$5.99</text>

    <line x1="15" y1="140" x2="345" y2="140" stroke="#f3f4f6" stroke-width="1" />

    <text x="15" y="170" fill="#111827" font-family="sans-serif" font-size="16" font-weight="bold">Total Final a Pagar</text>
    <text x="345" y="170" fill="#111827" font-family="sans-serif" font-size="18" font-weight="black" text-anchor="end">$67.99</text>
    
    <rect x="15" y="195" width="330" height="50" rx="4" fill="#fffbeb" stroke="#fef3c7" />
    <text x="25" y="215" fill="#b45309" font-family="sans-serif" font-size="9" font-weight="bold">NOTA IMPORTANTE:</text>
    <text x="25" y="230" fill="#b45309" font-family="sans-serif" font-size="9">Los cargos de procesamiento no son reembolsables.</text>
  </g>

  <!-- Términos e Input -->
  <g id="confirmar-pago-footer" transform="translate(20, 465)">
    <text x="0" y="20" fill="#6b7280" font-family="sans-serif" font-size="9">
      <tspan x="0" dy="0">Al hacer clic en "Confirmar Pago", declaras estar de acuerdo</tspan>
      <tspan x="0" dy="12">con las políticas de no-retorno y los cargos añadidos.</tspan>
    </text>
    
    <rect x="0" y="50" width="360" height="50" rx="8" fill="#4f46e5" />
    <text x="180" y="80" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CONFIRMAR PAGO DE $67.99</text>
  </g>
</svg>
