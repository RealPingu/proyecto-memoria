<svg width="400" height="800" viewBox="0 0 400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect id="fondo-celular" width="400" height="800" fill="#fafafa" />
  
  <!-- Header de la Tienda de Equipamiento -->
  <g id="header-tienda" fill="#0f172a">
    <rect x="0" y="0" width="400" height="55" />
    <text x="20" y="34" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">EQUIPOS GLACIALES S.A.</text>
  </g>

  <!-- Detalles del Producto -->
  <g id="producto-info" transform="translate(20, 75)">
    <text x="0" y="20" fill="#1e293b" font-family="sans-serif" font-size="15" font-weight="bold">Carrito de Compras</text>
    <rect x="0" y="35" width="360" height="110" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <rect x="15" y="50" width="80" height="80" rx="4" fill="#e2e8f0" />
    <text x="20" y="95" fill="#94a3b8" font-family="sans-serif" font-size="10">Campamento</text>
    <text x="110" y="68" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Saco de Dormir Térmico Camo</text>
    <text x="110" y="88" fill="#475569" font-family="sans-serif" font-size="11">Cantidad: 1</text>
    <text x="110" y="108" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">$120.00</text>
  </g>

  <!-- TRAMPA: Checkbox de seguro de envío premarcado con bajo contraste -->
  <g id="costos-ocultos-seguro-premarcado" transform="translate(20, 205)">
    <rect id="bg-seguro-trampa" width="360" height="75" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Checkbox premarcado -->
    <rect id="checkbox-seguro" x="15" y="25" width="22" height="22" rx="4" fill="#2563eb" />
    <!-- Signo de Checkmark -->
    <path d="M 20 36 L 24 40 L 32 30" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <text x="47" y="32" fill="#1e293b" font-family="sans-serif" font-size="11" font-weight="bold">Garantía Extendida de Protección Climática</text>
    <text x="47" y="47" fill="#64748b" font-family="sans-serif" font-size="9.5">Añade cobertura por derretimiento fortuito por solo +$18.99.</text>
    <text x="47" y="60" fill="#94a3b8" font-family="sans-serif" font-size="8.5">(Marcado por defecto para agilizar tu compra)</text>
  </g>

  <!-- Total e Información -->
  <g id="total-y-checkout" transform="translate(20, 300)">
    <line x1="0" y1="0" x2="360" y2="0" stroke="#e2e8f0" stroke-width="1" />
    
    <text x="0" y="25" fill="#475569" font-family="sans-serif" font-size="12">Subtotal</text>
    <text x="360" y="25" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">$120.00</text>
    
    <text x="0" y="45" fill="#475569" font-family="sans-serif" font-size="12">Garantía Extendida</text>
    <text x="360" y="45" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">$18.99</text>

    <text x="0" y="65" fill="#475569" font-family="sans-serif" font-size="12">Envío Estándar</text>
    <text x="360" y="65" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="end">Gratis</text>

    <line x1="0" y1="85" x2="360" y2="85" stroke="#cbd5e1" stroke-width="1" />

    <text x="0" y="110" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="bold">Total Final</text>
    <text x="360" y="110" fill="#0f172a" font-family="sans-serif" font-size="16" font-weight="black" text-anchor="end">$138.99</text>
    
    <rect x="0" y="140" width="360" height="50" rx="8" fill="#10b981" />
    <text x="180" y="170" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">PROCEDER AL CHECKOUT</text>
  </g>
</svg>
